[package]
name = "deskwarden"
# A `-dev` suffix means this build is NOT a GitHub release: it is the working
# tree, somewhere after the last tag. Cutting a release drops the suffix in the
# same commit that writes the CHANGELOG heading and moves the tag; the next
# commit after a release puts the following patch version back with `-dev` on
# it. `Version::parse` reads it as a semver prerelease, which orders it above
# the released version below it and below the release it is heading for -- so
# the updater offers 0.15.14 to a 0.15.14-dev build and does not offer 0.15.13.
version = "0.15.27"
edition = "2021"
license = "AGPL-3.0-or-later"
# NOT published to crates.io: this is a Windows application distributed as an
# installer, not a library anyone should depend on. It is also what lets
# `deny.toml` exclude this crate from the license allow-list via
# `private.ignore` -- the alternative was adding AGPL-3.0-or-later to that
# list, which would have silently permitted AGPL *dependencies* too.
publish = false
description = "Autofill Bitwarden credentials into native Windows applications. Unofficial and unaffiliated with Bitwarden, Inc."
readme = "README.md"
repository = "https://github.com/denis-platonov/deskwarden"

[lib]
name = "deskwarden"
path = "src/lib.rs"

# **The binary is `Deskwarden.exe`, capital D, and that spelling is the whole
# point of this section.** Without it Cargo names the executable after the
# package, in lower case, and Task Manager's Processes tab shows `deskwarden`
# until it has read the file's `FileDescription` and can swap in `Deskwarden`.
# The owner watched that happen: "in Task manager it shows up as deskwarden
# and then gets replaced with Deskwarden - make it capital from beginning."
# The description was already right; the IMAGE NAME is what Windows shows
# first, and the image name is this file name.
#
# The library keeps `deskwarden`, because that one is a Rust identifier --
# `use deskwarden::...` -- and not a file anybody sees.
[[bin]]
name = "Deskwarden"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    # ProcessIdToSessionId, for src/single_instance.rs. The forced half of a
    # takeover ends a process ONLY when it is in this logon session, which is
    # the scope the app mutex is named in; without the check a relaunch could
    # kill another signed-in user's Deskwarden.
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    # Rounded corners + shadow for the frameless login window's custom
    # titlebar (login_ui::round_window_corners).
    "Win32_Graphics_Dwm",
    # Native Authenticode verification (src/signature.rs): WinVerifyTrust
    # plus the crypt32 calls that read the signer certificate.
    "Win32_Security_WinTrust",
    # WinRT namespaces for Windows Hello quick unlock (src/hello.rs):
    # KeyCredentialManager lives in Security.Credentials; its buffers come
    # from Security.Cryptography (CryptographicBuffer) + Storage.Streams.
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Foundation",
    # Monitor geometry for clamping the autofill overlay on-screen
    # (MonitorFromWindow/GetMonitorInfoW) and pixel access for extracting an
    # app icon from its HICON (GetDIBits) in the Add-app picker.
    "Win32_Graphics_Gdi",
    # SHGetFileInfoW, for reading an exe's small icon (picker_ui.rs), and
    # ShellExecuteW, for opening a vault item's website in the default
    # browser (vault_window/mod.rs::webbrowser_open) without shelling out to
    # cmd.exe.
    "Win32_UI_Shell",
    # COMDLG_FILTERSPEC, for the file-type dropdown on the edit form's
    # "Browse..." dialog (src/file_picker.rs). IFileOpenDialog itself is in
    # Win32_UI_Shell above; only the filter struct lives in ::Common.
    "Win32_UI_Shell_Common",
    # GetFileVersionInfoW/VerQueryValueW, for reading an executable's
    # FileDescription so the edit form can show "Google Chrome" rather than
    # "chrome.exe" (src/app_identity.rs).
    "Win32_Storage_FileSystem",
    # RegOpenKeyExW/RegEnumKeyExW/RegGetValueW, for finding the CURRENT
    # versioned install directory of a Microsoft Store (MSIX) package whose
    # stored path has expired (src/app_identity.rs).
    "Win32_System_Registry",
    # OpenClipboard/EmptyClipboard/SetClipboardData/RegisterClipboardFormatW
    # and GetClipboardSequenceNumber (src/clipboard.rs). This app sets the
    # clipboard through raw Win32 rather than through eframe's convenience
    # copy because the suppression formats that keep a copied password out of
    # Win+V history and off the user's other devices have to go on in the
    # SAME clipboard operation as the text, and no convenience API exposes
    # that.
    "Win32_System_DataExchange",
    # GlobalAlloc/GlobalLock/GlobalUnlock/GlobalFree: SetClipboardData takes
    # ownership of a GMEM_MOVEABLE block, so the payload cannot be an
    # ordinary Rust allocation.
    "Win32_System_Memory",
    # CF_UNICODETEXT and the CLIPBOARD_FORMAT newtype it is expressed in.
    "Win32_System_Ole",
    # WTSRegisterSessionNotification, so this process is told when the
    # workstation is locked (Win+L) or the session is switched away from and
    # can lock the vault at that moment instead of waiting out the idle timer
    # (src/away_lock.rs). The WTS_SESSION_* codes it matches on live here too.
    # No window is created for it: the registration goes on the hidden helper
    # window the tray icon already owns.
    "Win32_System_RemoteDesktop",
    # Media Foundation, for reading a QR code off a webcam (src/webcam.rs):
    # MFStartup/MFEnumDeviceSources/MFCreateDeviceSource and the source reader
    # that hands back frames. It is the only capture API on Windows that
    # enumerates cameras, converts their native NV12/MJPG output to RGB for
    # us, and works on Windows 10 without a package identity -- DirectShow is
    # deprecated and the WinRT MediaCapture classes want one. The device is
    # opened on a thread of that module's own and released when the surface
    # that owns it drops.
    "Win32_Media_MediaFoundation",
    # SystemTimeToTzSpecificLocalTime, plus the FILETIME/SYSTEMTIME round trip
    # around it (src/local_time.rs). This crate carries no date library and
    # wants none: its own arithmetic covers the civil calendar, but "was
    # daylight saving in effect at THAT instant" is a question only the OS can
    # answer correctly after the binary has shipped, and applying
    # GetTimeZoneInformation's rule by hand gets the southern hemisphere and
    # every rescheduled transition wrong.
    "Win32_System_Time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# ureq 2.12's own TLS stack, named here so `http_agent` can hand it a
# `ClientConfig` of its own. The ONE thing that needs one is the site-icon
# fetch's "ignore certificate errors on my own LAN" switch: ureq exposes no
# per-agent knob for that, only `AgentBuilder::tls_config`, which takes a
# `rustls::ClientConfig` -- so the type has to be nameable here or the setting
# cannot exist. The version tracks ureq's exactly (2.12.1 -> rustls 0.23,
# rustls-pki-types 1) because a `ClientConfig` from a different rustls is a
# different type and will not compile against ureq's builder; that mismatch
# failing loudly is the reason both are pinned rather than left to unify.
#
# `default-features = false` plus ureq's own four is not tidying: rustls's
# default provider is `aws-lc-rs`, a C library wanting cmake and NASM on
# Windows, and turning it on here would add a toolchain requirement to a build
# that has never needed one -- for a feature that is one checkbox. ureq builds
# rustls on `ring`, and an agent whose `ClientConfig` was made by a different
# provider than the one the agent installs is a runtime panic, not a compile
# error. So this list mirrors ureq's exactly.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
# The server's notifications hub (src/rest/notifications.rs): the websocket
# Bitwarden's own clients hold open so a change made in one of them reaches
# the others without being asked for. `handshake` only -- no TLS feature of
# its own: the stream it is handed is a rustls one built from the same ring
# provider and the same Mozilla roots ureq verifies every other request
# against, so the app has one TLS stack and one trust list, not two.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The trust list above, named directly because the hub's TLS config is built
# here rather than by ureq. Already in the tree through ureq; this adds no
# crate, only the right to name it.
webpki-roots = "1"
# SVG favicons (src/favicon.rs): a site whose only icon is `/favicon.svg`
# drew a monogram. No default features: no text (so no font database and no
# read of the system's fonts), no raster images (an `<image>` is skipped), no
# svgz. What is left draws shapes and fetches, reads and runs nothing.
resvg = { version = "0.48", default-features = false }
directories = "5"
tray-icon = "0.19"
# 0.31+ is where egui's text rendering got visibly sharper (better gamma
# handling / AlphaFromCoverage); the design comparison was done against 0.35.
# default-features off to keep the glow renderer 0.29 used: the default wgpu
# renderer's DX12 backend pins a newer `windows` crate than this app does,
# and the two cannot coexist in one build.
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
] }
global-hotkey = "0.6"
log = "0.4"
env_logger = "0.11"
# "serde" feature: LoginData.password is Zeroizing<String> (see
# vault_bridge.rs), so every clone of it self-wipes on drop -- items()
# hands out clones of the whole vault, so zeroizing only VaultCache::clear's
# own copy would be a false sense of security. Zeroizing<T>'s Serialize/
# Deserialize impls (this feature) delegate straight to T's, so the wire
# format is unchanged.
zeroize = { version = "1", features = ["serde"] }
semver = "1"
# Windows Hello quick unlock (src/hello.rs): the master password is sealed
# with AES-256-GCM under a key derived (SHA-256) from a Windows Hello
# KeyCredential signature, then DPAPI-wrapped at rest.
aes-gcm = "0.10"
# Have I Been Pwned's range API is keyed on SHA-1(password) and nothing
# else matches it (src/breach.rs). Not a security control -- an index.
# `sha2` is already here, so `digest`/`block-buffer`/`cpufeatures` are
# already in the tree: this adds one crate and no new transitive surface.
sha1 = "0.10"
# Argon2id, for the passphrase that seals a TOTP seed inside a record Send
# (src/record/seal.rs). NOT interchangeable with the `sha2` already here:
# `hello.rs` derives its key from a Windows Hello signature, which has full
# entropy, so one SHA-256 is right there. A record's seal is derived from a
# passphrase a human chose, over ciphertext that may sit on a Bitwarden server
# for days -- a single hash is a few hundred million guesses per second on one
# GPU, and no parameter of SHA-256 can be turned up to change that. RustCrypto,
# same family as `sha2`/`aes-gcm`; pulls in `base64ct` and `password-hash`.
argon2 = "0.5"
sha2 = "0.10"

# The local vault service's HTTP server. Default features only: no TLS,
# because it binds loopback and nothing else, and a TLS stack here would be
# a large dependency defending a hop that never leaves the machine.
tiny_http = { version = "0.12", default-features = false }
getrandom = "0.2"
# Decodes fetched favicons to RGBA (src/favicon.rs); also used by the
# ui_preview example's --screenshot mode to save the rendered overlay card
# as a PNG for visual review.
#
# **It is also half of the ICO decoding in `favicon.rs`, whose other half is
# HAND-WRITTEN -- and this block is the argument for that, because it is not
# the argument `rqrr` makes below and must not be mistaken for it.**
#
# The problem first: `/favicon.ico` is the one icon path every web server
# answers whether or not anybody configured it, so a large share of what both
# the icon service and a direct fetch hand back is a Windows icon file rather
# than a PNG. Measured against the owner's own vault rather than assumed:
# `play.google.com` (4286 bytes, `image/x-icon`), `adobe.com` (15086 bytes,
# `image/x-icon`) and `clients.amazonworkspaces.com` (15086 bytes,
# `image/vnd.microsoft.icon`) all answered 200 with a real icon. Note the two
# different MIME types for one format, which is why `favicon.rs` sniffs magic
# bytes and never a `Content-Type`.
#
# **The obvious answer was `image` with its `ico` feature, and the honest
# measurement is that it would have been CHEAPER than it looks.** `image
# 0.25.10` is ALREADY in this tree -- `cargo tree -i image` -- pulled by
# `arboard` for `egui-winit`'s clipboard image data, with exactly its `bmp`
# and `png` features on. `image`'s `ico = ["bmp", "png"]`, both of which are
# therefore already enabled, so turning it on would have added ZERO crates
# and zero new feature-gated dependencies. **The "large transitive tree"
# sentence under `rqrr` below does NOT apply here**, and borrowing it would
# have been a rationalisation rather than a reason.
#
# It was still refused, on three narrower grounds. **Two of the three have
# since been overtaken by events** -- the QR image route made `image` a direct
# dependency of this crate, with `ico` among its features -- and marking that
# here, rather than leaving a stale argument standing, is the whole point of
# having written it down:
#
#  * SPENT. It would make this crate a DIRECT dependent of `image`, whose
#    version is currently chosen entirely by `eframe`. A second constraint on
#    a name this app does not otherwise talk to means an `eframe` bump that
#    moves `image` forward either duplicates it in the tree or forces a
#    coordinated edit here -- recurring cost, for a container format with no
#    compression in it. That cost has since been paid for a caller worth it
#    (JPEG, GIF and WebP are not container formats with no compression in
#    them), so it is no longer a reason to refuse anything.
#  * SPENT. Cargo features are additive and unified, so `image/ico` would be
#    on for `arboard` too. `ico` is now on, for the QR route; what that
#    concretely does to the clipboard is argued at the `image` entry below,
#    and the answer is measured rather than assumed.
#  * STANDS, and it was always the load-bearing one. The part that actually
#    needed writing is not the container. `favicon.rs`
#    picks the entry closest ABOVE its own display target and breaks ties on
#    colour depth, because its resampler never upscales; a general-purpose
#    decoder returns one image on its own rule, so the directory walk would
#    have been written here regardless. What delegation would have saved is
#    the ~90-line bottom-up DIB row walk, and nothing else.
#
# A dedicated `ico` crate was the third candidate, refused on the smallest
# margin of all: one more registry name to pin, review and re-audit at every
# bump, for those same ~90 lines.
#
# **Hand-parsing an untrusted format is normally the wrong call, so the
# argument that it is acceptable here is specifically about THIS format's
# shape.** An ICO container is a fixed 6-byte header, a table of fixed
# 16-byte entries, and a payload that is either a whole PNG -- handed
# straight back to this crate, because `favicon.rs` writes no second PNG
# decoder -- or an uncompressed `BITMAPINFOHEADER` bitmap. No compression to
# implement, no back-references, no state machine, no variable-length
# encoding, no recursion: every field is a fixed-width integer at a fixed
# offset, and the decoder is bounds checks plus a row walk. It allocates
# exactly one buffer, sized `width * height * 4` with both dimensions refused
# above 256, so no header field ever sizes an allocation. Compressed
# (`biCompression != 0`) and non-`BITMAPINFOHEADER` payloads are refused
# outright rather than guessed at, and every malformed shape answers `None`,
# which the caller already treats as "this item keeps its monogram".
#
# That last claim is held up by tests rather than by this paragraph. The
# `favicon` test module builds the malformed containers itself -- truncated
# headers, a zero entry count, offsets past the end, byte sizes larger than
# the file, absurd dimensions, a payload that is neither PNG nor DIB, and a
# cursor wearing an icon's layout -- and asserts `None` rather than a panic
# for each. No test in this crate fetches anything over the network.
png = "0.17"
# Reads a QR code out of a captured region or an image file (src/qr.rs), so a
# user can add a one-time code by dragging a box around the QR already on
# their screen. Pure Rust with NO `unsafe` in its own source, no I/O, no
# network and no C dependency -- which is why it is this crate rather than a
# `zbar`/`quirc` binding: the pixels it is handed are the secret in visual
# form, and a decoder that could not touch a file or a socket is a decoder
# whose whole failure surface is a wrong answer.
#
# `default-features = false` is load-bearing, not tidiness, and the reason
# survived `image` becoming a direct dependency below -- it just stopped being
# the reason it was first written for. The default `img` feature would have
# `rqrr` open and sniff files ITSELF, through an `image` whose format list is
# then `rqrr`'s default rather than this crate's choice. `decode_qr` is handed
# a bare RGBA buffer and nothing else, so the decision about which untrusted
# file formats this app parses is made in exactly ONE place -- the `image`
# entry below, which names them one at a time -- instead of in two places that
# can drift. Without it, this adds SEVEN crates: `rqrr` itself,
# `g2p`/`g2gen`/`g2poly` (its Galois-field arithmetic, for Reed-Solomon), and
# `lru` + `hashbrown` + `allocator-api2`. `proc-macro2`, `quote`, `syn`,
# `equivalent` and `foldhash` were already in the tree.
rqrr = { version = "0.10", default-features = false }
# Turns the file behind design 6a's "Open an image file" route into the RGBA
# buffer `rqrr` above reads a QR code out of
# (`src/vault_window/totp_add.rs::image_to_rgba`). The owner's rule for that
# route is "all images should work"; a screenshot or a phone photo of a QR
# code arrives as any of the formats named below, and a PNG-only reader was a
# feature that refused the file the user actually had.
#
# **It is ALREADY in this tree** -- `cargo tree -i image` -- pulled by
# `arboard` for `egui-winit`'s clipboard image data with `bmp` and `png` on,
# and by `eframe` with `png`. Naming it here makes it DIRECT rather than
# transitive, which is a real cost and is the one the `png` entry above
# declined to pay for `favicon`'s ICO decoding: `image`'s version is otherwise
# chosen entirely by `eframe`, so an `eframe` bump that moves `image` forward
# now either duplicates it in the tree or forces a coordinated edit here. That
# refusal was about a container format with no compression in it. This is
# about JPEG, GIF and WebP, which nothing in this tree can otherwise read and
# which no ninety-line hand-written parser is going to cover.
#
# `default-features = false` with six formats named one at a time, because the
# default set is not six. It also turns on TIFF, DDS, TGA, HDR, OpenEXR, PNM,
# QOI, farbfeld and AVIF -- nine more parsers of a file this app was pointed
# at by a file dialog, and not one of them a format a screen capture or a
# phone camera produces. `ico` is `["bmp", "png"]`, both of which are on
# anyway, so it costs nothing and is here because a `.ico` on a Windows disk
# is a real picture a user might point at.
#
# **Cargo features are additive and unified, so these formats are compiled
# into `arboard`'s copy of `image` too, and the honest question is what that
# does to the clipboard.** Measured rather than assumed: `arboard`'s Windows
# path names `image::codecs::bmp::BmpDecoder` and
# `image::codecs::png::PngDecoder` by type and never asks `image` to guess a
# format, so what the clipboard will decode is exactly what it decoded before.
# The widening is in what is LINKED, not in what is REACHABLE from that path.
#
# It adds THREE crates: `gif`, its `color_quant`, and `image-webp`. The JPEG
# decoder (`zune-jpeg` + `zune-core`) was already in `Cargo.lock`, as were
# `weezl`, `quick-error`, `byteorder-lite`, `bytemuck` and `moxcms` -- `image`
# reaches the first four through its `tiff` feature, which `arboard` turns on
# for macOS, so `Cargo.lock` already carried them for a platform this app does
# not ship to. All three new crates are `MIT` or `MIT OR Apache-2.0`, already
# on `deny.toml`'s allow-list; nothing was added to it to make this fit.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }

# ---- the direct-REST vault backend's cryptography (src/rest/crypto.rs) -----
#
# These six exist for ONE reason: talking to a Bitwarden-compatible server
# without the `bw` CLI means this process derives the master key itself and
# unwraps every key below it. `bw` did that until now, which is why none of
# these were here. All six are RustCrypto, the same family as the `sha2`,
# `aes-gcm` and `argon2` already above, so they share `digest`/`subtle`/
# `cipher` rather than bringing a second set.
#
# `aes` is the AES-256 block cipher for the CBC half of Bitwarden's
# `EncString` (its AEAD sibling `aes-gcm`, already here, cannot be pointed at
# CBC). It is ALREADY IN THE TREE as `aes-gcm`'s own dependency and at the
# same version, so naming it here adds a line and no crate.
aes = "0.8"
# CBC mode over that block cipher, with PKCS#7 unpadding. One crate, no
# transitive additions: it is `cipher`, which is already here.
cbc = "0.1"
# HMAC-SHA256, used for BOTH halves of the composition: the MAC that
# authenticates an `EncString` before a single byte of it is decrypted, and
# the PRF inside PBKDF2 and HKDF below. One crate, over the `digest` traits
# `sha2` already provides. Its `verify_slice` is the constant-time comparison
# the MAC check goes through -- `subtle::ConstantTimeEq` underneath, which is
# why no separate `subtle` line appears here.
hmac = "0.12"
# HKDF-SHA256, for the one step Bitwarden calls "key stretching": the 32-byte
# master key is EXPANDED (extract is skipped -- the master key is the PRK)
# into a 32-byte encryption key and a 32-byte MAC key. Hand-rolling ten lines
# of RFC 5869 was the alternative and was rejected: this crate is verified
# against the RFC's own vectors upstream as well as in `rest::crypto`.
hkdf = "0.12"
# PBKDF2-HMAC-SHA256, the master-key KDF for every account whose server did
# not move it to Argon2id. `default-features = false` drops the `simple`
# feature and with it the `password-hash` string format, which nothing here
# uses: the input is a per-account iteration count from the server and the
# output is 32 raw bytes.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# RSA-OAEP-SHA1, and nothing else, for unwrapping an ORGANISATION's symmetric
# key with the user's private key. There is no way to avoid it: that is the
# format Bitwarden servers store organisation keys in.
#
# It is the only crate here that is not small. It brings `num-bigint-dig` and
# its arithmetic tail. It also carries RUSTSEC-2023-0071 (the Marvin attack --
# a timing side-channel in RSA decryption) with no fixed version available;
# see the module docs in `src/rest/crypto.rs` for why a LOCAL, one-shot
# unwrap of an already-fetched org key is not the repeated-oracle exposure
# that advisory is about, and `deny.toml` for the recorded decision.
rsa = "0.9"
# Reads `bw.exe` out of the `bw-windows-<version>.zip` Bitwarden publishes
# (src/bw_acquire.rs). That archive is the ONLY form the CLI is distributed
# in -- there is no bare-executable asset -- so an extractor is not optional
# if the app is to acquire the CLI itself.
#
# `default-features = false` with only `deflate` is load-bearing, not
# tidiness. The default feature set pulls in bzip2 (a C library), zstd,
# lzma/xz, and AES + PBKDF2 decryption for encrypted archives: four more
# format parsers and an FFI dependency, every one of them pointed at bytes
# that arrived over the network, and none of them reachable by a Bitwarden
# release asset, which is plain deflate. The surface this crate is allowed
# is deliberately the smallest one that can open the file in question.
#
# `flate2` (with its pure-Rust `miniz_oxide` backend, no zlib C) is the only
# meaningful transitive addition; `crc32fast` comes with it.
#
# Note what this dependency is NOT trusted for: nothing it returns is
# executed. The extracted file is Authenticode-verified
# (`signature::verify_authenticode`) before it is copied to the install path,
# and it is never run -- not even `bw --version` -- so a malformed archive
# yields a refusal, not a process.
zip = { version = "2", default-features = false, features = ["deflate"] }
# OPTIONAL, AND OFF IN EVERY BUILD THAT SHIPS. The engine behind
# `test_http::Matcher::Regex`, which five call sites use. It is named here as
# well as in `[dev-dependencies]` because `test_http` has to compile in two
# configurations: the library's own test target, where the dev-dependency
# supplies it, and the library built for `main.rs`'s test target, where
# `test-support` does. `cargo build` turns on neither, so `regex` is not
# linked into the shipped binary.
regex = { version = "1", optional = true }

[features]
# The one thing this feature does is un-gate `test_http` and `test_vault` in
# `lib.rs`, which are otherwise `#[cfg(test)]` and therefore invisible to
# `main.rs` -- a SEPARATE CRATE that reaches this one through `deskwarden::`
# and links the library built WITHOUT `cfg(test)`. That invisibility is why
# `main.rs` was the last `mockito` caller in the tree, and `mockito` 1.7.2
# resets loopback connections (`os error 10054`); see `src/test_http.rs`.
#
# It is NOT a `cfg(test)` seam: no production item changes shape, appears or
# disappears with it. It only decides whether two test-only modules are
# compiled, and nothing outside a test target ever turns it on -- the
# dev-dependency below is the only thing that does.
test-support = ["dep:regex"]

[dev-dependencies]
# THIS CRATE, ON ITSELF, WITH `test-support` ON. A dev-dependency cycle is
# explicitly allowed by cargo, and this one adds no code to the tree: the
# path is this same directory, so the only effect is that the library
# `main.rs`'s TEST target links is built with the feature above and can see
# `deskwarden::test_http`. `cargo build` does not resolve dev-dependencies,
# so a shipped binary still links a library with neither module in it.
#
# This is the one path dependency in this manifest, and it is deliberate:
# `job_object`'s whole-file pin exists because re-pointing a REGISTRY name at
# a path or a fork runs foreign code. This points a name at the crate that
# name already means.
deskwarden = { path = ".", features = ["test-support"] }
# The same crate as the optional `regex` above, named again here because the
# library's OWN test target compiles `test_http` under `cfg(test)` with no
# feature turned on. `mockito` -- which brought `regex` and its three
# dependencies into the tree in the first place, at this version, for exactly
# the same matcher -- is GONE from this manifest: `main.rs` was its last user
# and `test_http::no_module_in_this_crate_builds_a_mockito_server` is what
# keeps it gone.
regex = "1"

[build-dependencies]
# Embeds assets/deskwarden.ico as the executable's icon resource (see
# build.rs). Build-time only: nothing from this crate is linked into the
# shipped binary, only the .res it produces.
winresource = "0.1"

[profile.release]
# This app spends nearly all its life sitting in the tray with no window
# open -- smaller, more cross-crate-inlined code means less of it resident
# at idle, not just a smaller installer download.
lto = true
codegen-units = 1
strip = true
