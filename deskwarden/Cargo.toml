[package]
name = "deskwarden"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Autofill Bitwarden credentials into native Windows applications. Unofficial and unaffiliated with Bitwarden, Inc."
readme = "README.md"
# No `repository` field: no public repository exists yet, and a placeholder URL
# would be worse than none.

[lib]
name = "deskwarden"
path = "src/lib.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_Security",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
directories = "5"
tray-icon = "0.19"
eframe = "0.29"
global-hotkey = "0.6"
log = "0.4"
env_logger = "0.11"
zeroize = "1"
semver = "1"

[dev-dependencies]
mockito = "1"
