# cargo-deny configuration.
#
# Run with:
#   cargo deny check
#
# The license list below is the set of permissive licenses actually present in
# this crate's dependency tree, all compatible with distributing this
# MIT-licensed crate as a binary. Adding a license here is a deliberate
# decision, not a formality -- anything not listed fails the check.

[licenses]
# This crate itself is AGPL-3.0-or-later and is deliberately NOT in the list
# below. `publish = false` in Cargo.toml makes it private, and this excludes
# private crates from the check -- so the allow-list stays a statement about
# what this app is willing to LINK AGAINST, which is the question it exists to
# answer. Adding AGPL to the list instead would have permitted AGPL
# dependencies as a side effect of relicensing our own code.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    # webpki-roots: the Mozilla CA root store, published as data under the
    # Community Data License Agreement (permissive variant). Redistribution,
    # including in binaries, is explicitly permitted.
    "CDLA-Permissive-2.0",
    # option-ext (via directories/dirs): weak, file-level copyleft. Using it
    # unmodified as a library imposes no obligation on this crate.
    "MPL-2.0",
    # error-code (via clipboard-win/arboard): permissive, no attribution
    # requirement for binary distribution.
    "BSL-1.0",
]
confidence-threshold = 0.8

# epaint (via eframe/egui) bundles the Ubuntu Light font, licensed under the
# Ubuntu Font Licence 1.0: a permissive font licence that allows
# redistribution, including embedded in software. Allowed for this crate
# specifically rather than for the whole graph.
#
# **The identifier changed and this file did not notice.** It read
# `LicenseRef-UFL-1.0`, with a comment asserting that UFL-1.0 has no SPDX
# identifier. SPDX has since assigned one -- `Ubuntu-font-1.0` -- and epaint
# now declares it, so the exception stopped matching and `cargo deny check
# licenses` had been failing. Nothing caught it because CI does not run
# cargo-deny at all; this file is a manual tool, and a manual tool that
# nobody runs is a manual tool that rots.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[bans]
# Duplicate versions of transitive crates are pulled in by the GUI stack
# (eframe/winit) and are not a licensing or security concern.
multiple-versions = "allow"

[advisories]
yanked = "warn"
# Only crates this workspace depends on directly are failed for being
# unmaintained. The unmaintained advisories in the tree are all deep transitive
# dependencies of the GUI stack (`ttf-parser` via egui's font rasterizer,
# `paste` as a build-time proc-macro, the gtk-rs bindings via tray-icon's
# *Linux* backend) with no safe upgrade available and no fix under our control.
unmaintained = "workspace"
ignore = [
    # **The quick-xml acceptances were removed on 2026-08-27**, and the way
    # they were found is the point: `cargo deny` had never run in CI, so two
    # entries went on excusing a crate that had already left the dependency
    # tree. `advisory-not-detected` is a warning rather than an error, so an
    # ignore list rots quietly in the direction of excusing more than it
    # should. CI runs this now.
    # RUSTSEC-2023-0071, the "Marvin attack": a timing side-channel in the
    # `rsa` crate's private-key operation. There is NO fixed version -- the
    # advisory has stood open since 2023 and the constant-time rewrite has not
    # landed -- so this is not a deferred upgrade, it is a decision.
    #
    # It is ignored, deliberately and narrowly, and the argument is about
    # exposure rather than severity. Marvin is a *repeated-oracle* attack:
    # it recovers a key from many thousands of timed decryptions that an
    # attacker gets to trigger and measure. The one place this crate uses
    # `rsa` is `rest::crypto::unwrap_org_key` -- unwrapping an organisation
    # key, locally, in this process, once per session, from ciphertext the
    # server already handed over. An attacker who can time that loop is
    # already running code in this process's address space, where the
    # unwrapped key is sitting in memory anyway.
    #
    # **This stops being true the moment anything here decrypts RSA on
    # behalf of a remote caller, in a loop, or with attacker-chosen
    # ciphertext.** Nothing does today. If that changes, this line must be
    # revisited before the code ships, not after.
    "RUSTSEC-2023-0071",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
