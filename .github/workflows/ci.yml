# .github/workflows/ci.yml
#
# Runs on every push and pull request, so a red tree is found in minutes
# rather than at the next release tag.
#
# Until 2026-08-17 the ONLY workflow in this repository was release.yml,
# which triggers on "v*.*.*" tags. Between tags nothing was checked at all.
#
# WHY EACH COMMIT AND NOT JUST THE TIP. `f67bf42` does not compile: it imports
# `crate::app::FillChoice`, which the NEXT commit introduces. A conventional
# tip-only CI would have passed that push without complaint, because the tip
# was green -- the breakage lives in the middle of the range and is invisible
# from either end. That is the defect class this file exists for, so the
# "compiles" job walks the pushed commits individually.
#
# It cannot repair f67bf42. That commit is an ancestor of v0.5.0, v0.6.0 and
# v0.7.0, all of which have published binaries, so rewriting it would
# invalidate the whole release history to correct a commit nobody will check
# out. It is recorded rather than rewritten; this guard stops the next one.
name: CI

on:
  push:
    branches: ["main"]
    # A README, a screenshot or a spec cannot change whether the crate
    # compiles, so they do not get the four-job matrix. Between 21:19 and
    # 22:10 on 2026-08-28 six documentation commits each paid for tests, a
    # coverage run, a Mesa download plus an eleven-surface screenshot walk,
    # and a per-commit `cargo check`. None of it could have found anything.
    #
    # **There is deliberately no path filter here, and there was one for a
    # day.** It ignored `**.md` and `docs/**` so a documentation push would
    # not run the matrix -- added to save Actions minutes, which was the
    # wrong reason: this repository is PUBLIC, and public repositories run
    # standard GitHub-hosted runners for free. It saved nothing anybody pays
    # for. See docs/ci-and-actions-minutes.md, which measured where the
    # account's minutes actually went (a private fork's macOS nightly).
    #
    # What it cost was real. Branch protection requires three of these jobs,
    # and a run skipped by a path filter reports NO STATUS -- not a green
    # one. A documentation-only pull request would therefore wait forever on
    # checks that never arrive, and no amount of re-running fixes it. The
    # remedy would have been a second workflow declaring no-op jobs under the
    # same three names, kept in step with them for ever.
    #
    # A filter that saves no money, in exchange for a merge that cannot
    # complete and a workflow to maintain, is a bad trade. Running the matrix
    # on a README commit costs wall-clock nobody is waiting on.
  pull_request:
    branches: ["main"]
  # Manual runs can pick the runner. Default false, so nothing changes
  # unless somebody deliberately asks for the local machine. See the
  # "runner" job below -- and the security note above it -- before using it.
  workflow_dispatch:
    inputs:
      self_hosted:
        description: "Run on the self-hosted Windows runner"
        type: boolean
        default: false

# A superseded run is wasted time and a misleading red. Keep the newest per
# ref and cancel the rest.
#
# On main, one group PER COMMIT, and `cancel-in-progress: false` was NOT
# enough. The runs prove it: 33212017060, 33213431791, 33214469055 and
# 33040707278 are all `cancelled` on main with ZERO jobs -- they were evicted
# while still pending, because a concurrency group replaces the run waiting
# in it when a newer one arrives. cancel-in-progress governs RUNNING jobs
# only, so the flag was doing exactly what it says and still losing runs.
#
# That is a correctness bug, not just waste. The `compiles` job walks
# `github.event.before..HEAD`; when push A's run is evicted while pending,
# push B's run starts from A's tip, so A's commits are checked by neither --
# and that happens precisely during a rapid burst, which is when a broken
# intermediate commit is most likely. It is the exact guarantee the header of
# this file says the job exists to provide.
#
# Keying on the SHA gives each push to main its own group, so nothing queues
# behind anything and nothing can be evicted. The cost is that several main
# runs may execute in parallel during a burst; this repository is public, so
# GitHub bills none of it. See docs/ci-and-actions-minutes.md §4.3.
concurrency:
  # Folded onto one line before GitHub sees it: every continuation below is
  # at the same indent as the first, so YAML joins them with spaces rather
  # than keeping the newlines inside the `${{ }}`.
  group: >-
    ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main'
    && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One place that decides which machine the four Windows jobs land on, so
  # they cannot drift apart. It emits a JSON `runs-on` value -- either the
  # string "windows-latest" or the array ["self-hosted","windows"] -- which
  # each job passes through `fromJSON`, because `runs-on` needs one shape or
  # the other and an expression can only return a string.
  #
  # A job rather than a workflow-level `env:`: the `env` context is NOT
  # readable from a job-level `runs-on` (the contexts available there are
  # github, needs, strategy, matrix, vars and inputs), so the tidier-looking
  # version silently resolves to nothing and every job fails to schedule.
  # One free Linux job-minute buys an expression that is unambiguously valid.
  #
  # ---------------------------------------------------------------------
  # SECURITY. READ THIS BEFORE REGISTERING A RUNNER. IT IS NOT OPTIONAL.
  # ---------------------------------------------------------------------
  #
  # Deskwarden is a PUBLIC repository and it is a CREDENTIAL TOOL. Anyone on
  # the internet can open a pull request against it. A self-hosted runner is
  # not a disposable VM -- it is somebody's actual Windows machine, running
  # as their user, with their filesystem, their network, their SSH keys and,
  # on the machine this app is developed on, a real Bitwarden session. A job
  # that reaches it executes a stranger's code there and keeps whatever that
  # code leaves behind. GitHub states plainly that self-hosted runners
  # "should only be used for private repositories" for this reason:
  # https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/manage-access
  #
  # What makes the switch below safe BY CONSTRUCTION, and what must stay
  # true of it:
  #
  #   1. `inputs.self_hosted` exists only for workflow_dispatch. It is unset
  #      for push and pull_request, and the check below additionally demands
  #      `github.event_name == 'workflow_dispatch'`. A fork pull request
  #      therefore cannot reach the runner no matter what its author writes
  #      in the PR -- there is no field in a pull_request payload that feeds
  #      this expression.
  #   2. workflow_dispatch can only be fired by an account with write access
  #      to this repository. A stranger cannot start such a run at all.
  #
  # Do NOT later "simplify" this into a condition a pull request can
  # influence -- an `if` on a label, a branch name, a commit message or a PR
  # title -- because every one of those is attacker-controlled.
  #
  # Before enabling it, ALL of the following must be true, and none of them
  # can be done from this file:
  #
  #   * The runner is registered at REPOSITORY scope, not account scope. An
  #     account-level runner is reachable by every repository the owner
  #     owns, including a public one created later without thinking.
  #   * It runs in a VM or a throwaway Windows account -- never on the
  #     workstation holding a real vault.
  #   * Settings -> Actions -> General -> "Fork pull request workflows" is
  #     set to require approval for all external contributors. Belt and
  #     braces behind (1), and worth setting even if no runner ever exists.
  #
  # Until a runner is actually registered this switch is inert: nothing is
  # listening on those labels, so a dispatched run with the box ticked
  # simply queues. That is the intended default state. The minutes it would
  # save are minutes GitHub does not charge for on a public repository, so
  # if the care above is more than the convenience is worth, the honest
  # answer is to leave it off. See docs/ci-and-actions-minutes.md §4.2.
  runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - name: Decide
        id: pick
        shell: bash
        env:
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${SELF_HOSTED:-false}" = "true" ]; then
            echo 'labels=["self-hosted","windows"]' >> "$GITHUB_OUTPUT"
            echo "self-hosted runner requested by a manual dispatch."
          else
            echo 'labels="windows-latest"' >> "$GITHUB_OUTPUT"
            echo "GitHub-hosted windows-latest."
          fi

  # The full bar the project actually holds: tests green, zero warnings,
  # measured on the tree as it will be built.
  test:
    name: Tests and warnings
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deskwarden

      # Debug, not --release, for the reason release.yml gives at length:
      # identical-COMDAT-folding was measured on this crate and does NOT make
      # a fake seam compare equal to the real one, so the shipping profile
      # buys no coverage the debug profile lacks -- at several minutes of LTO
      # per run.
      - name: Run the test suite
        working-directory: deskwarden
        run: cargo test -j 8

      # "Zero warnings, including a shipping build" is a standing rule in
      # every plan in docs/superpowers/plans. A rule nothing enforces is a
      # rule that decays, so it is enforced here.
      #
      # RUSTC warnings, not clippy. Clippy was measured on this crate on
      # 2026-08-17 and reports roughly a hundred findings -- mostly
      # `type_complexity`, `doc_list_item_without_indentation` and
      # `manual_contains` -- so `clippy -D warnings` would have redded on its
      # first run. A gate that is red the day it lands does not get fixed, it
      # gets deleted or `continue-on-error`'d, and then it guards nothing.
      # Clippy is worth a pass of its own; it is not worth making this gate
      # untrustworthy on day one.
      - name: Deny warnings
        working-directory: deskwarden
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --all-targets -j 8

      # `deny.toml` is a real policy -- which licences this app is willing to
      # link against, and which advisories it has accepted with a reason --
      # and until now NOTHING RAN IT. It rotted exactly as an unrun check
      # does: the epaint font exception was written as `LicenseRef-UFL-1.0`,
      # SPDX later assigned `Ubuntu-font-1.0`, epaint started declaring that,
      # the exception stopped matching, and `cargo deny check licenses` had
      # been failing for an unknown length of time with nobody to tell.
      #
      # `licenses` and `advisories`, not `all`: `bans` is deliberately
      # permissive here (`multiple-versions = "allow"`, because the GUI stack
      # pulls duplicates) and `sources` adds nothing while every dependency
      # comes from crates.io.
      #
      # Advisories go stale on their own schedule rather than on this repo's,
      # so a new one can turn this red on a commit that changed nothing. That
      # is the point -- it is how the advisory gets seen -- and the answer is
      # to read it and record the decision in `deny.toml`, which already
      # carries one such acceptance for RUSTSEC-2023-0071.
      # A prebuilt binary rather than `cargo install`, which built cargo-deny
      # and its whole dependency tree from source, on Windows, on every run.
      # `Swatinem/rust-cache` caches the WORKSPACE target directory, not
      # ~/.cargo/bin, so none of that work was ever reused -- several minutes
      # a run for a tool that ships binaries. This workflow already uses the
      # right mechanism one job over, for cargo-llvm-cov.
      #
      # **The ^0.20 pin is preserved, and it is load-bearing.** It was pinned
      # to ^0.16 first and that failed on the very first CI run:
      # `unmaintained = "workspace"` is a key 0.16.4 had removed and 0.20
      # reintroduced, so the config was correct locally and invalid on the
      # runner. Pin the version the config was actually tested against.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@^0.20

      - name: Audit licences and advisories
        working-directory: deskwarden
        run: cargo deny check licenses advisories

  # A picture of every surface this app draws, on every push, for a human to
  # look at.
  #
  # WHY. Unit coverage on this crate is around 92% and functional coverage was
  # zero. Three real defects in one day were invisible to 2500 tests -- card
  # editing silently gated off for a fortnight, a rehearsal window that worked
  # and looked wrong, and a text baseline displacement a person spotted in a
  # second -- and four separate UI tests were found *structurally blind* to
  # the thing they appeared to check. This job does not fix that. It puts the
  # surfaces where somebody can see them every time they change, which is the
  # cheapest thing that would have caught any of the three.
  #
  # ARTIFACTS, NOT COMMITTED IMAGES. A committed screenshot set is a
  # merge-conflict generator, and the value here is looking at them, not
  # diffing bytes.
  #
  # AND EXPLICITLY NOT A PIXEL-DIFF GATE. A golden-image comparison over an
  # anti-aliased egui surface reds on a font-rendering change, on a driver
  # update, on a runner-image bump. A gate that reds for reasons nobody caused
  # gets `continue-on-error`'d and then deleted, and the pictures go with
  # it.
  #
  # The only assertions here are about whether the *walk ran*, never about
  # what a pixel is:
  #
  #   * `if-no-files-found: error` -- an upload of nothing must not be green.
  #   * the walk counts its own output against `ALL` and panics if they
  #     disagree, which catches "the walk stopped after the third surface" --
  #     a failure that otherwise leaves a perfectly valid, perfectly useless
  #     artifact. That check lives in the example, beside the list it counts,
  #     because it used to live here as a literal and went stale the first
  #     time somebody added a surface.
  #
  # A SEPARATE JOB, not steps bolted onto `test`. It runs in parallel with the
  # other two, so it adds nothing to the wall clock, and a flake in a window
  # system cannot red the project's actual bar. The walk itself takes about
  # five seconds once the example is built.
  #
  # NO REAL VAULT, NO NETWORK, NO `bw`. Every surface renders from fixtures
  # held in the example -- see its module doc, which states that as a
  # ---- coverage ------------------------------------------------------
  #
  # **A floor, not a target.** The number is published for a badge, but the
  # thing that fails the build is the floor below -- a percentage nobody
  # enforces drifts down one uncovered branch at a time and is noticed by
  # nobody. The floor is set from the first measured run and raised
  # deliberately, never lowered to make a red build green.
  #
  # This does NOT gate the release: it runs beside the other jobs, and a
  # coverage dip is a thing to look at rather than a thing that stops a
  # security fix shipping.
  coverage:
    name: Coverage
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    # At the JOB level deliberately: a step's own `env:` is not visible to
    # that step's `if:`, so the upload condition below would have been read
    # against an unset value and never fired -- or fired always.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deskwarden

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `--no-fail-fast` for the reason `scripts/ci-locally.sh` learned the
      # hard way: cargo stops after a target fails, so without it a failing
      # lib target means the bin target is never measured at all.
      - name: Measure
        working-directory: deskwarden
        run: cargo llvm-cov --no-fail-fast --lcov --output-path lcov.info -j 8

      - name: Report and enforce the floor
        working-directory: deskwarden
        shell: bash
        run: |
          set -euo pipefail
          # Read the summary llvm-cov already computed rather than
          # re-deriving it from the lcov file: two ways of computing one
          # number is two numbers.
          pct=$(cargo llvm-cov report --summary-only \
                | awk '/^TOTAL/ {gsub(/%/, "", $10); print $10}')
          echo "line coverage: ${pct}%"
          echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          # **85, from a measured 86.87% on the first run.** Set just under
          # the real figure rather than at it: a floor equal to today's
          # number turns every ordinary refactor into a red build, and a
          # guard people learn to override is worse than none. Two points of
          # slack absorbs normal movement; a real regression clears it.
          #
          # Raise it when the number rises. Never lower it to make a red
          # build green -- that is the one edit this comment exists to make
          # somebody stop and justify.
          floor=85
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p+0 >= f+0) }' || {
            echo "coverage ${pct}% is below the floor of ${floor}%" >&2
            exit 1
          }

      # Uploaded only when a token is configured, so a fork's build -- and
      # this repo before anyone sets one up -- neither fails nor silently
      # pretends to publish. Coverage data is file paths and line counts,
      # no vault content, but it is still this repo's shape leaving the
      # machine, so it is opt-in rather than on by default.
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: deskwarden/lcov.info
          fail_ci_if_error: false
  # property of the file rather than a hope.
  screenshots:
    name: Screenshots of every surface
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    # Nothing here needs to write, and a third-party DLL runs in this job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deskwarden

      # A SOFTWARE OpenGL, because the runner has none.
      #
      # This job wrote zero PNGs from the day it was added until 2026-08-18,
      # and the reason was only visible once the walk stopped masking it:
      # `egui_glow requires opengl 2.0+`. GitHub's windows-latest images ship
      # no OpenGL 2.0 driver, and this app uses eframe's glow renderer on
      # purpose -- the wgpu DX12 backend pins a newer `windows` crate than the
      # app does, and the two cannot coexist (see Cargo.toml).
      #
      # Mesa's llvmpipe is a software rasteriser: drop its opengl32.dll beside
      # the executable and the same frames render on the CPU.
      #
      # PINNED AND HASH-VERIFIED, and that is not ceremony. This is a
      # third-party binary executing inside the CI of a credential tool, so
      # the version is fixed, the SHA-256 is checked before anything is
      # extracted, and the job is `contents: read` so the token it runs under
      # can do nothing but read this repository. If the download changes under
      # the tag, the hash check fails and nothing runs.
      - name: Build the preview
        working-directory: deskwarden
        run: cargo build --example ui_preview

      - name: Install a software OpenGL (Mesa3D llvmpipe)
        shell: pwsh
        run: |
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z'
          $want = 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          $got = (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) {
            Write-Error "Mesa archive hash mismatch. wanted $want, got $got -- refusing to extract."
            exit 1
          }
          7z x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa/x64/*.dll deskwarden/target/debug/examples/ -Force
          Write-Host "placed:"; Get-ChildItem deskwarden/target/debug/examples/*.dll | Select-Object -ExpandProperty Name

      - name: Render every surface
        working-directory: deskwarden
        env:
          # Force the software rasteriser rather than whatever the loader
          # would otherwise pick.
          GALLIUM_DRIVER: llvmpipe
        run: cargo run --example ui_preview -- --all

      # The walk asserts its own count now -- see the tail of
      # examples/ui_preview.rs. This step only lists what came out, so a
      # reader of the log can see it without downloading the artifact.
      #
      # It used to assert `expected=9` here. `ALL` grew to eleven surfaces
      # and this number did not, so the job went red over a count nobody
      # had to change when adding a surface. A number obliged to agree with
      # a list, kept in a different file from the list, is the defect this
      # crate keeps losing to; the count now lives beside the surfaces.
      - name: List what the walk produced
        shell: bash
        working-directory: deskwarden
        run: ls -l target/ui_preview

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: deskwarden/target/ui_preview/*.png
          # Green on an empty upload is the failure mode this job is most
          # likely to have and least likely to notice.
          if-no-files-found: error
          # Long enough to review a pull request at leisure, short enough that
          # a year of pushes is not being stored. These are regenerated by
          # every run; nothing is lost when one expires.
          retention-days: 14

  # Every commit introduced by this push must compile on its own. `cargo
  # check` rather than a full build or the test suite: the property being
  # defended is "this commit is a coherent tree", and the tip's full run above
  # covers everything else. Checking is fast enough to afford per commit.
  compiles:
    name: Every new commit compiles
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the range below needs the commit before
          # the push and a shallow clone does not have it.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deskwarden

      - name: Check each commit in the range
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A pull request is checked against its base; a push against what
          # the ref pointed at before. A branch's first push reports an
          # all-zero "before" and has no range to speak of, so fall back to
          # the tip alone rather than walking the project's whole history.
          if [ -n "${BASE:-}" ]; then
            range="$BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~0..HEAD"
          fi

          commits=$(git rev-list --reverse "$range")
          if [ -z "$commits" ]; then
            echo "No new commits in $range -- nothing to check."
            exit 0
          fi

          count=$(printf '%s\n' "$commits" | wc -l | tr -d ' ')
          echo "Checking $count commit(s) in $range."

          # A backstop, not a policy: a push of hundreds of commits is a merge
          # of old work, and paying for each is not worth it. Say so out loud
          # rather than silently checking a subset -- an unannounced cap reads
          # as "all of them were fine".
          limit=25
          if [ "$count" -gt "$limit" ]; then
            echo "::warning::$count commits pushed, which is more than the $limit this job \
          walks. Only the last $limit are checked individually; the tip is fully tested by the \
          other job either way."
            commits=$(printf '%s\n' "$commits" | tail -n "$limit")
          fi

          failed=""
          for sha in $commits; do
            subject=$(git log -1 --format='%s' "$sha")
            echo "::group::$sha  $subject"
            git checkout --quiet --detach "$sha"
            if (cd deskwarden && cargo check --all-targets -j 8); then
              echo "ok"
            else
              echo "::error::$sha does not compile on its own: $subject"
              failed="$failed $sha"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "These commits do not compile in isolation:$failed"
            echo "Squash or reorder them so each commit is a coherent tree. See the note at the \
          top of this file for why the tip being green is not enough."
            exit 1
          fi
          echo "Every checked commit compiles."
