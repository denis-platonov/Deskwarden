# .github/workflows/release.yml
#
# Builds deskwarden, packages it with Inno Setup, and publishes both the
# bare executable and the installer as GitHub Release assets whenever a
# "vX.Y.Z" tag is pushed.
#
# The release BODY is composed here rather than written by hand, because the
# app renders it: `updater::release_notes_blocks` reads it straight onto the
# Preferences -> Updates panel, so what this workflow emits is what a user
# reads before deciding to install. The shape and the reasoning are at the
# "Compose the release body" step below.
#
# Signing: SignPath integration is a disclosed, pending manual prerequisite
# (see docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md).
# Until the SignPath project is approved and its GitHub Action documented,
# the two "Sign ... (SignPath)" steps below are labeled TODO no-ops so the
# pipeline still runs end to end -- producing an explicitly UNSIGNED build,
# rather than silently shipping as if it were signed.
#
# What the app checks in the meantime, and why this workflow needs no step
# for it: the self-updater verifies the installer it downloads against the
# per-asset SHA-256 `digest` field the GitHub releases API already returns
# alongside `browser_download_url` (updater.rs). GitHub computes that digest
# from the uploaded bytes, so nothing here has to publish a checksum, and
# there is deliberately no SHA256SUMS asset to keep in step with the files.
# That check is NOT a stand-in for signing -- its trust root is this
# repository's GitHub account, not a publisher certificate -- and it does not
# reduce the reason the two steps below still say TODO. See
# docs/code-signing-policy.md.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-run a release without deleting and re-pushing a public tag. Run it
  # against the tag ref (`gh workflow run Release --ref vX.Y.Z`): every step
  # below reads `github.ref_name`, which is the tag name for a tag ref
  # whichever event started the run, so a dispatched run and a pushed one
  # produce byte-identical output.
  #
  # Added because v0.5.0's tag push produced no run at all -- Actions
  # enabled, workflow active, tag on the remote matching "v*.*.*", and no
  # queued job. With no dispatch trigger the only remedies were retagging or
  # publishing by hand, both worse than a button.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # deskwarden.iss's AppVersion/OutputBaseFilename and updater.rs's
      # release-asset parsing (`tag.strip_prefix('v')`, then
      # `Version::parse`) both work in terms of a bare semver with no
      # leading "v" -- e.g. deskwarden.iss was built and tested locally
      # with `/DAppVersion=0.1.0`, not "v0.1.0". Release tags, on the other
      # hand, are "vX.Y.Z" (github.ref_name for a "v*.*.*" tag push), so
      # the leading "v" must be stripped here before it's passed to ISCC,
      # to stay consistent with that convention.
      - name: Determine app version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Nothing else ties the tag to the crate's own version, and they are
      # read by different things: the installer's version and file name come
      # from the tag (above), while the running binary reports
      # env!("CARGO_PKG_VERSION") and updater.rs compares *that* against the
      # latest release tag. Tag v0.2.0 without bumping Cargo.toml and the
      # shipped build still calls itself 0.1.0, so after a "successful"
      # update the tray permanently offers v0.2.0 and every click
      # re-downloads and re-installs the same build forever. Fail the release
      # here instead, before anything is built or published.
      - name: Verify Cargo.toml version matches the release tag
        working-directory: deskwarden
        run: |
          $metadata = cargo metadata --format-version=1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'deskwarden' }
          if (-not $package) {
            Write-Error "could not find the 'deskwarden' package in cargo metadata output"
            exit 1
          }
          $crateVersion = $package.version
          Write-Host "tag version:   $env:APP_VERSION"
          Write-Host "crate version: $crateVersion"
          if ($crateVersion -ne $env:APP_VERSION) {
            Write-Error ("Release tag and Cargo.toml disagree: tag says '$env:APP_VERSION', " +
              "deskwarden/Cargo.toml says '$crateVersion'. Bump the crate version to match " +
              "the tag (or retag), otherwise the shipped binary reports the wrong version to " +
              "the updater and every user is stuck in a permanent update loop.")
            exit 1
          }

      # Until 2026-08-13 this workflow built a release without running a single
      # test. That was not a small gap: `spawn_send_create` -- the seam that
      # publishes a Send to the internet -- was found able to have its body
      # emptied with every static guard still green, and it fell only to a
      # behavioural test. A pipeline that compiles but never runs anything
      # cannot see that class of defect at all.
      #
      # Debug rather than `--release` on purpose. The one argument for testing
      # the shipping profile was that identical-COMDAT-folding might make a
      # fake seam compare equal to the real one by address under
      # `lto = true, codegen-units = 1`; that was measured on this crate and
      # does NOT happen -- a byte-identical twin is still KILLED in release. So
      # debug buys the same coverage in ~30s instead of adding another LTO
      # build to every release.
      #
      # This step runs BEFORE the binary is built, so a red test costs a minute
      # rather than a full package-and-publish cycle.
      - name: Run the test suite
        working-directory: deskwarden
        run: cargo test -j 8

      - name: Build release binary
        working-directory: deskwarden
        run: cargo build --release

      # TODO(SignPath): once the SignPath account/project is approved,
      # replace this placeholder with SignPath's GitHub Action (exact
      # name/inputs TBD from SignPath's own docs once available) to sign
      # deskwarden/target/release/deskwarden.exe. This is the disclosed,
      # manual-prerequisite gap called out in
      # docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md,
      # not a placeholder meant to silently stand in for real signing.
      - name: Sign binary (SignPath) [TODO - pending SignPath account approval]
        run: |
          echo "TODO: wire SignPath signing once the account is approved -- see docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md. This build is UNSIGNED. The updater's SHA-256 digest check is not a substitute; see docs/code-signing-policy.md."

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc deskwarden/installer/deskwarden.iss /DAppVersion=$env:APP_VERSION

      # TODO(SignPath): sign
      # deskwarden/installer/deskwarden-<version>-installer.exe once the
      # SignPath project exists. Same disclosed gap as the binary-signing
      # step above.
      #
      # Signing this file would NOT invalidate the updater's digest check:
      # GitHub computes the published digest from whatever bytes are uploaded
      # in the step below, so a signed installer simply gets the digest of the
      # signed file. Adding an Authenticode gate back to updater.rs at that
      # point is meant to be an ADDITIONAL check, not a replacement.
      - name: Sign installer (SignPath) [TODO - pending SignPath account approval]
        run: |
          echo "TODO: wire SignPath signing once the account is approved. This installer is UNSIGNED. The updater's SHA-256 digest check is not a substitute; see docs/code-signing-policy.md."

      # The release body, in the shape the app's "What is new" panel reads.
      #
      # WHY THIS IS COMPOSED RATHER THAN HARD-CODED. Until v0.9.0 the body was
      # a fixed template that led with the unsigned-build caveat, so the panel
      # -- which renders the GitHub release body verbatim, see
      # `updater::release_notes_blocks` -- opened every update on a disclaimer
      # rather than on what the release does. v0.9.0's body was rewritten by
      # hand into the shape below. This step makes every future release get
      # that shape without anyone remembering to.
      #
      # WHERE THE BULLETS COME FROM. `CHANGELOG.md`'s section for the version
      # being released, whose `### ` headings are already one line per
      # user-visible change -- that IS the list, written once. Asking a human
      # to write it a second time into a release body is how the two drift.
      #
      # WHY THE EXTRACTION IS RELIABLE. It is a two-state scan over lines, not
      # a Markdown parse: `## <version>` opens the section, the next `## `
      # closes it, and `### ` lines in between are the bullets. `^##\s` cannot
      # match a `### ` heading (the third character is `#`, not whitespace),
      # so the two levels cannot be confused. Nothing about the prose BELOW a
      # `### ` is read, so a section can contain anything -- blockquotes,
      # code, lists -- without affecting the result. The version is matched
      # against `$env:APP_VERSION`, which an earlier step has already proved
      # equal to the crate version and to the tag.
      #
      # WHAT IT DOES WHEN THE SECTION IS MISSING. Warns loudly in the job log
      # and publishes the rest of the body -- the link and the two notes --
      # without the "What's new" block. It deliberately does NOT fail the
      # release: the tag is already public by the time this runs, the missing
      # thing is prose rather than a correctness problem (unlike the
      # tag/crate-version mismatch above, which really does strand every
      # user), and a body can be edited on the release page afterwards while
      # a failed publish cannot be un-failed. The warning is what makes the
      # omission visible.
      - name: Compose the release body
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $version = $env:APP_VERSION
          $bullets = @()
          $found = $false
          if (Test-Path -LiteralPath $changelog) {
            $inSection = $false
            foreach ($line in (Get-Content -LiteralPath $changelog -Encoding utf8)) {
              if ($line -match '^##\s') {
                if ($inSection) { break }
                if ($line -match ('^##\s+' + [regex]::Escape($version) + '(\s|$)')) {
                  $inSection = $true
                  $found = $true
                }
                continue
              }
              if ($inSection -and $line -match '^###\s+(.+)$') {
                $bullets += $Matches[1].Trim()
              }
            }
          } else {
            Write-Host "::warning::CHANGELOG.md is missing from the checkout."
          }

          $parts = @()
          if ($bullets.Count -gt 0) {
            $parts += "## What's new in $version"
            $parts += ""
            foreach ($bullet in $bullets) { $parts += "- $bullet" }
            $parts += ""
          } elseif ($found) {
            Write-Host ("::warning::CHANGELOG.md has a section for $version but no '### ' " +
              "headings in it, so this release body has no 'What's new' list.")
          } else {
            Write-Host ("::warning::CHANGELOG.md has no '## $version' section, so this " +
              "release body has no 'What's new' list. Add one and edit the release body.")
          }

          # The TAG, never `main`: this link is read by someone installing
          # THIS release, possibly long after the file has moved on, and it
          # has to keep saying what this release contained.
          $parts += "**[Full changelog]($env:REPO_URL/blob/$env:REF_NAME/CHANGELOG.md)**"
          $parts += ""
          $parts += "---"
          $parts += ""
          $parts += "**Note:** this build is unsigned. SignPath code-signing"
          $parts += "integration is pending manual account approval; see"
          $parts += "docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md."
          $parts += ""
          $parts += "Deskwarden's in-app updater verifies the installer it downloads"
          $parts += "against the SHA-256 digest GitHub publishes for the asset, and"
          $parts += "refuses to run it on any mismatch. That checks the bytes, not the"
          $parts += "publisher -- it is not equivalent to a signed build. See"
          $parts += "docs/code-signing-policy.md."

          # UTF-8 without a BOM: the changelog has em dashes and a `⋮` in its
          # headings, and a BOM would arrive as stray characters at the head
          # of the panel's first line.
          $body = $parts -join "`n"
          $path = Join-Path $env:GITHUB_WORKSPACE 'release-body.md'
          Set-Content -LiteralPath $path -Value $body -Encoding utf8NoBOM
          Write-Host "--- release body ---"
          Write-Host $body

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            deskwarden/target/release/deskwarden.exe
            deskwarden/installer/deskwarden-*-installer.exe
          # `body_path`, and `generate_release_notes` deliberately OFF.
          #
          # The generated notes are a commit/PR list appended AFTER whatever
          # `body` says, which on this project means the app's "What is new"
          # panel ended on a wall of commit subjects below the digest note --
          # the same panel the shape above exists to keep readable. What that
          # list was for is now the "Full changelog" link, which points at a
          # file written for people rather than at a diff.
          body_path: release-body.md
