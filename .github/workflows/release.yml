# .github/workflows/release.yml
#
# Builds deskwarden, packages it with Inno Setup, and publishes both the
# bare executable and the installer as GitHub Release assets whenever a
# "vX.Y.Z" tag is pushed.
#
# Signing: SignPath integration is a disclosed, pending manual prerequisite
# (see docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md).
# Until the SignPath project is approved and its GitHub Action documented,
# the two "Sign ... (SignPath)" steps below are labeled TODO no-ops so the
# pipeline still runs end to end -- producing an explicitly UNSIGNED build,
# rather than silently shipping as if it were signed.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-run a release without deleting and re-pushing a public tag. Run it
  # against the tag ref (`gh workflow run Release --ref vX.Y.Z`): every step
  # below reads `github.ref_name`, which is the tag name for a tag ref
  # whichever event started the run, so a dispatched run and a pushed one
  # produce byte-identical output.
  #
  # Added because v0.5.0's tag push produced no run at all -- Actions
  # enabled, workflow active, tag on the remote matching "v*.*.*", and no
  # queued job. With no dispatch trigger the only remedies were retagging or
  # publishing by hand, both worse than a button.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # deskwarden.iss's AppVersion/OutputBaseFilename and updater.rs's
      # release-asset parsing (`tag.strip_prefix('v')`, then
      # `Version::parse`) both work in terms of a bare semver with no
      # leading "v" -- e.g. deskwarden.iss was built and tested locally
      # with `/DAppVersion=0.1.0`, not "v0.1.0". Release tags, on the other
      # hand, are "vX.Y.Z" (github.ref_name for a "v*.*.*" tag push), so
      # the leading "v" must be stripped here before it's passed to ISCC,
      # to stay consistent with that convention.
      - name: Determine app version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Nothing else ties the tag to the crate's own version, and they are
      # read by different things: the installer's version and file name come
      # from the tag (above), while the running binary reports
      # env!("CARGO_PKG_VERSION") and updater.rs compares *that* against the
      # latest release tag. Tag v0.2.0 without bumping Cargo.toml and the
      # shipped build still calls itself 0.1.0, so after a "successful"
      # update the tray permanently offers v0.2.0 and every click
      # re-downloads and re-installs the same build forever. Fail the release
      # here instead, before anything is built or published.
      - name: Verify Cargo.toml version matches the release tag
        working-directory: deskwarden
        run: |
          $metadata = cargo metadata --format-version=1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'deskwarden' }
          if (-not $package) {
            Write-Error "could not find the 'deskwarden' package in cargo metadata output"
            exit 1
          }
          $crateVersion = $package.version
          Write-Host "tag version:   $env:APP_VERSION"
          Write-Host "crate version: $crateVersion"
          if ($crateVersion -ne $env:APP_VERSION) {
            Write-Error ("Release tag and Cargo.toml disagree: tag says '$env:APP_VERSION', " +
              "deskwarden/Cargo.toml says '$crateVersion'. Bump the crate version to match " +
              "the tag (or retag), otherwise the shipped binary reports the wrong version to " +
              "the updater and every user is stuck in a permanent update loop.")
            exit 1
          }

      # Until 2026-08-13 this workflow built a release without running a single
      # test. That was not a small gap: `spawn_send_create` -- the seam that
      # publishes a Send to the internet -- was found able to have its body
      # emptied with every static guard still green, and it fell only to a
      # behavioural test. A pipeline that compiles but never runs anything
      # cannot see that class of defect at all.
      #
      # Debug rather than `--release` on purpose. The one argument for testing
      # the shipping profile was that identical-COMDAT-folding might make a
      # fake seam compare equal to the real one by address under
      # `lto = true, codegen-units = 1`; that was measured on this crate and
      # does NOT happen -- a byte-identical twin is still KILLED in release. So
      # debug buys the same coverage in ~30s instead of adding another LTO
      # build to every release.
      #
      # This step runs BEFORE the binary is built, so a red test costs a minute
      # rather than a full package-and-publish cycle.
      - name: Run the test suite
        working-directory: deskwarden
        run: cargo test -j 8

      - name: Build release binary
        working-directory: deskwarden
        run: cargo build --release

      # TODO(SignPath): once the SignPath account/project is approved,
      # replace this placeholder with SignPath's GitHub Action (exact
      # name/inputs TBD from SignPath's own docs once available) to sign
      # deskwarden/target/release/deskwarden.exe. This is the disclosed,
      # manual-prerequisite gap called out in
      # docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md,
      # not a placeholder meant to silently stand in for real signing.
      - name: Sign binary (SignPath) [TODO - pending SignPath account approval]
        run: |
          echo "TODO: wire SignPath signing once the account is approved -- see docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md. This build is UNSIGNED."

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc deskwarden/installer/deskwarden.iss /DAppVersion=$env:APP_VERSION

      # TODO(SignPath): sign
      # deskwarden/installer/deskwarden-<version>-installer.exe once the
      # SignPath project exists. Same disclosed gap as the binary-signing
      # step above.
      - name: Sign installer (SignPath) [TODO - pending SignPath account approval]
        run: |
          echo "TODO: wire SignPath signing once the account is approved. This installer is UNSIGNED."

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            deskwarden/target/release/deskwarden.exe
            deskwarden/installer/deskwarden-*-installer.exe
          generate_release_notes: true
          body: |
            **Note:** this build is unsigned. SignPath code-signing
            integration is pending manual account approval; see
            docs/superpowers/specs/2026-07-28-deskwarden-distribution-design.md.
